name: CI & Quantitative Release Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test_and_verify:
    name: Typecheck, Lint & Mathematical Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Verify No Uncommitted Credential Leaks
        run: |
          if git grep -E "(PRIVATE KEY|apiKey.*[a-zA-Z0-9]{32})" src/; then
            echo "CRITICAL: Hardcoded credentials detected!"
            exit 1
          fi
          echo "Credential hygiene check passed."

  release:
    name: Build & Publish Release
    needs: test_and_verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, Verify & Build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Package Raspberry Pi Release Archive
        run: |
          tar -czvf kalshi-quant-${{ github.ref_name }}.tar.gz dist/ package.json package-lock.json

      - name: Publish GitHub Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: kalshi-quant-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

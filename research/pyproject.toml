[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantscale-ai"
version = "0.1.0"
description = "Research-only binary prediction contract replay"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quantscale = "quantscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
